# ============================================
# Docker Compose - Production (Oracle VPS)
# ============================================
# Purpose: Production deployment on Oracle Cloud Infrastructure
# Usage: docker-compose -f docker-compose.prod.yml up -d
# ============================================

services:
  # ============================================
  # Rust Microservice (Production - Pre-built Image)
  # ============================================
  ms1:
    image: ghcr.io/mrglasses/excelsiorfull:${APP_VERSION:-latest}
    container_name: ms1-app-prod
    platform: linux/arm64
    restart: always
    ports:
      - "${MS_PORT:-3000}:${MS_PORT:-3000}"  # Expose to host for reverse proxy (Nginx/Caddy)
    environment:
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PSWD: ${DATABASE_PSWD}
      DATABASE_PORT: ${DATABASE_PORT}
      MS_PORT: ${MS_PORT}
      EXTERNAL_SERVICE_URL: ${EXTERNAL_SERVICE_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-excelsior-prod}
      ENVIRONMENT: production
      RUST_LOG: ${RUST_LOG:-info,ms1=debug}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      WORKER_SHUTDOWN_TIMEOUT_SECS: ${WORKER_SHUTDOWN_TIMEOUT_SECS:-8}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      # No MongoDB here: the app doesn't use it, and on 2026-11-13 a broken Mongo kept
      # the app from starting at all.
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${MS_PORT:-3000}/ping" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Resource limits for Oracle VPS (adjust based on your instance)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================
  # MariaDB Database (Production)
  # ============================================
  db:
    container_name: mariadb-prod
    # Image versions are pinned (major.minor): never ":latest" for a database.
    # A re-download of ":latest" can jump a major version and refuse the old data
    # (2026-11-13: mongo latest went 8.2 -> 9.0). Upgrade on purpose, by editing the tag.
    image: mariadb:13.0
    platform: linux/arm64
    restart: always
    ports:
      - "127.0.0.1:1021:3306"  # Only accessible from the VPS itself (was open on all interfaces)
    environment:
      MARIADB_ROOT_PASSWORD: ${DATABASE_PSWD}
      MARIADB_DATABASE: ${DATABASE_NAME}
      # Run mariadb-upgrade by itself when the version changes (patch updates within 13.0).
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - mariadb-data:/var/lib/mysql
      # AUTO-RUN MIGRATIONS ON FIRST START
      - ./migrations:/docker-entrypoint-initdb.d:ro
      # Production: Add backup volume
      - ./backups/mariadb:/backups
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ============================================
  # MongoDB (Production)
  # ============================================
  mongodb:
    # Pinned to the version that wrote the data (featureCompatibilityVersion 8.2).
    # Going to 9.0 means setting the FCV first, not just changing this tag.
    image: mongo:8.2
    container_name: mongodb-prod
    platform: linux/arm64
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"  # Only accessible from localhost
    volumes:
      - mongo-data:/data/db
      - ./backups/mongodb:/backups
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ============================================
  # Redis (Production)
  # ============================================
  redis:
    image: redis:8.10
    container_name: redis-prod
    platform: linux/arm64
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:6379:6379"  # Only accessible from localhost
    volumes:
      - redis-data:/data
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ============================================
  # Grafana All-in-One (Production Monitoring)
  # ============================================
  grafana-allinone:
    container_name: grafana-otel-prod
    image: grafana/otel-lgtm:0.41.0
    platform: linux/arm64
    restart: always
    ports:
      - "127.0.0.1:3050:3000"    # Grafana UI: only via SSH tunnel, e.g. ssh -L 3050:127.0.0.1:3050 user@vps
      - "127.0.0.1:4317:4317"    # OTLP gRPC (internal only)
      - "127.0.0.1:4318:4318"    # OTLP HTTP (internal only)
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      # Keep logs (Loki) for 3 days only: small VPS disk.
      - LOKI_EXTRA_ARGS=-compactor.retention-enabled=true -compactor.delete-request-store=filesystem -store.retention=72h
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

# ============================================
# Persistent Volumes (Production)
# ============================================
volumes:
  mariadb-data:
    driver: local
  mongo-data:
    driver: local
  redis-data:
    driver: local
  grafana-data:
    driver: local

# ============================================
# Network Configuration (Production)
# ============================================
networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16